version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grounded-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grounded_rag
    ports:
      - "5550:5432"
    volumes:
      - grounded_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grounded_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grounded-redis
    restart: always
    ports:
      - "6395:6379"
    volumes:
      - grounded_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  grounded_postgres_data:
  grounded_redis_data:
